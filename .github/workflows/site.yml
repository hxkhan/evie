name: Site

# Builds the website (the guide and the playground) on every change that can
# affect it, and publishes it to GitHub Pages from main.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "examples/**", "README.md", "**/*.go", "go.mod", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "examples/**", "README.md", "**/*.go", "go.mod", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Vet the WebAssembly entry point
        run: GOOS=js GOARCH=wasm go vet ./site/wasm
        working-directory: .

      - name: Build
        env:
          # a project page lives under /<repository>/; use / for a custom domain
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Test the interpreter
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
