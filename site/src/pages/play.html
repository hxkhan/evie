<main class="play">
  <div class="play__toolbar" role="toolbar" aria-label="Playground">
    <div class="picker" id="example">
      <span class="visually-hidden" id="example-label">Example</span>
      <button class="picker__button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="example-menu" aria-labelledby="example-label example-current">
        <span id="example-current">Your code</span>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
      </button>
      <ul class="picker__menu" id="example-menu" role="listbox" tabindex="-1" aria-labelledby="example-label" hidden></ul>
    </div>
    <button id="run" class="button button--primary" type="button" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
      Run <kbd data-mod>Ctrl ↵</kbd>
    </button>
    <button id="stop" class="button" type="button" hidden>Stop</button>
    <button id="share" class="button button--quiet" type="button">Share</button>
    <span id="status" class="status" role="status">Loading Evie…</span>
  </div>

  <div class="play__panes">
    <section class="pane pane--editor" aria-label="Code">
      <div id="editor" class="editor"></div>
    </section>

    <section class="pane pane--output" aria-label="Output">
      <div class="pane__bar">
        <span class="pane__title">Output</span>
        <button id="clear" type="button">Clear</button>
      </div>
      <div id="panel-output" class="output" aria-live="polite">
        <p class="output__hint">Press <kbd data-mod>Ctrl ↵</kbd> or <b>Run</b>. Output, the program's result and any errors appear here. When the program reads a line, type it here and press <kbd>↵</kbd>; <kbd>Ctrl D</kbd> ends the input.</p>
      </div>
    </section>
  </div>
</main>
